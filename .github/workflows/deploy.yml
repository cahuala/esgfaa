name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # nada é publicado se algum teste falhar
  testes:
    uses: ./.github/workflows/testes.yml

  build:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # endereço da API (Settings → Secrets and variables → Actions → Variables → API_URL)
          VITE_API_URL: ${{ vars.API_URL }}
      # o GitHub Pages serve 404.html em rotas desconhecidas; assim o React Router trata delas
      - run: cp dist/index.html dist/404.html
      # O painel só é publicado num endereço secreto (secret ADMIN_PATH, ex.: gestao-x7k4q9).
      # Sem o secret, o painel não é publicado.
      - name: Endereço do painel
        env:
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
        run: |
          if [[ "$ADMIN_PATH" =~ ^[a-z0-9-]{8,64}$ ]]; then
            mv dist/admin "dist/$ADMIN_PATH"
            echo "Painel publicado no endereço secreto."
          else
            rm -rf dist/admin
            echo "ADMIN_PATH não definido (ou inválido): painel não publicado."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
