name: Testes

# corre em cada pull request e antes de cada publicação (chamado por deploy.yml)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: esgfaa
          POSTGRES_PASSWORD: esgfaa_ci
          POSTGRES_DB: esgfaa_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esgfaa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL_TESTE: postgresql://esgfaa:esgfaa_ci@localhost:5432/esgfaa_teste
      DATABASE_URL_E2E: postgresql://esgfaa:esgfaa_ci@localhost:5432/esgfaa_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: api

      - name: Base de dados dos testes ponta-a-ponta
        run: PGPASSWORD=esgfaa_ci psql -h localhost -U esgfaa -d esgfaa_teste -c 'CREATE DATABASE esgfaa_e2e'

      - name: Lint
        run: npm run lint

      - name: API (unidade e integração, com cobertura)
        run: npm run test:cobertura
        working-directory: api

      - name: Site e painel (Vitest)
        run: npm run test:cobertura

      - name: Ponta-a-ponta (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          CI: true

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
