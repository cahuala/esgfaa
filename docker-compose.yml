# PostgreSQL (desenvolvimento e testes) e tradutor automático do site:  docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: esgfaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: esgfaa
      POSTGRES_PASSWORD: esgfaa_dev
      POSTGRES_DB: esgfaa
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - esgfaa-pg:/var/lib/postgresql/data
      - ./api/prisma/bd-iniciais.sql:/docker-entrypoint-initdb.d/01-bd-iniciais.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esgfaa -d esgfaa"]
      interval: 2s
      timeout: 3s
      retries: 30

  # tradutor automático (código aberto, corre na máquina: nenhum texto sai da Escola)
  # só português, inglês, francês e espanhol; os modelos ficam no volume (descarregados na 1.ª vez)
  tradutor:
    image: libretranslate/libretranslate:v1.9.6
    container_name: esgfaa-tradutor
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: pt,en,fr,es
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
    ports:
      - "127.0.0.1:5005:5000"
    volumes:
      - esgfaa-tradutor:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 60

volumes:
  esgfaa-pg:
  esgfaa-tradutor:
