# Servidor INTERNO (rede da Escola, NUNCA exposto à internet): sistema de gestão de pessoal e a sua base de dados.
#   1. cp deploy/pessoal.env.example deploy/pessoal.env   e preencha
#   2. docker compose -f deploy/docker-compose.pessoal.yml --env-file deploy/pessoal.env up -d --build
# Na firewall: entradas 443 só da rede interna; saídas só para a API do portal e para a API do BI.
name: esgfaa-pessoal
services:
  bd:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pessoal
      POSTGRES_PASSWORD: ${BD_SENHA:?defina BD_SENHA}
      POSTGRES_DB: esgfaa_pessoal
    volumes:
      - bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pessoal -d esgfaa_pessoal"]
      interval: 5s
      timeout: 3s
      retries: 30

  pessoal:
    build:
      context: ..
      dockerfile: deploy/pessoal.Dockerfile
    restart: unless-stopped
    depends_on:
      bd:
        condition: service_healthy
    env_file: pessoal.env
    environment:
      DATABASE_URL: postgresql://pessoal:${BD_SENHA}@bd:5432/esgfaa_pessoal
      CORS_ORIGINS: https://${ENDERECO}
      TRUST_PROXY: "1"
    volumes:
      - dados:/app/api-pessoal/dados

  web:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - pessoal
    environment:
      ENDERECO: ${ENDERECO:?defina ENDERECO}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.pessoal:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data

volumes:
  bd:
  dados:
  caddy-dados:
