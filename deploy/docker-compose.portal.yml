# Servidor PÚBLICO da Escola: site, Portal Académico, painel de gestão, API e base de dados.
#   1. cp deploy/portal.env.example deploy/portal.env   e preencha (chaves, domínio, palavra-passe da BD)
#   2. docker compose -f deploy/docker-compose.portal.yml --env-file deploy/portal.env up -d --build
# O sistema de pessoal NÃO vai aqui (é só da rede interna: docker-compose.pessoal.yml).
name: esgfaa
services:
  bd:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: esgfaa
      POSTGRES_PASSWORD: ${BD_SENHA:?defina BD_SENHA}
      POSTGRES_DB: esgfaa
    volumes:
      - bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esgfaa -d esgfaa"]
      interval: 5s
      timeout: 3s
      retries: 30
    # a base de dados não fica exposta: só a API lhe acede (rede interna do Docker)

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      bd:
        condition: service_healthy
    env_file: portal.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://esgfaa:${BD_SENHA}@bd:5432/esgfaa
      PUBLIC_URL: https://${DOMINIO}
      PORTAL_URL: https://${DOMINIO}/portal/
      CORS_ORIGINS: https://${DOMINIO}
      TRUST_PROXY: "1"
    volumes:
      - dados:/app/api/dados

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        DOMINIO: ${DOMINIO:?defina DOMINIO}
        ADMIN_PATH: ${ADMIN_PATH:?defina ADMIN_PATH}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMINIO: ${DOMINIO}
      ADMIN_PATH: ${ADMIN_PATH}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-dados:/data
      - caddy-config:/config

  # cópia de segurança cifrada todos os dias às 2h (base de dados + ficheiros), no volume «copias»;
  # COPIAS_EXTRA: monte outro disco/servidor em /copias-extra para a cópia ficar também fora deste disco
  copias:
    build:
      context: ..
      dockerfile: deploy/copias.Dockerfile
    restart: unless-stopped
    depends_on:
      bd:
        condition: service_healthy
    command: ["node", "scripts/copias.mjs", "agendar", "--sistema", "portal"]
    environment:
      COPIAS_CHAVE: ${COPIAS_CHAVE:?defina COPIAS_CHAVE}
      COPIAS_EXTRA: ${COPIAS_EXTRA:-}
      PORTAL_DATABASE_URL: postgresql://esgfaa:${BD_SENHA}@bd:5432/esgfaa
      PORTAL_DADOS: /dados
    volumes:
      - dados:/dados:ro
      - copias:/copias
      # - /mnt/disco-externo:/copias-extra   (e COPIAS_EXTRA=/copias-extra no .env)

volumes:
  copias:
  bd:
  dados:
  caddy-dados:
  caddy-config:
