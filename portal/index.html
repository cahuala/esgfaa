<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Logo.png" />
    <!-- aplicação no telemóvel: ícone, cor da barra e instalação -->
    <link rel="manifest" href="/portal/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/portal/icones/apple-180.png" />
    <meta name="theme-color" content="#14100e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Portal ESG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..600&family=Inter+Tight:wght@600..900&family=Playfair+Display:ital,wght@0,500..800;1,500..700&display=swap" rel="stylesheet">
    <script>
      // aplica o tema guardado (ou o do sistema) antes de o portal ser desenhado
      try {
        var t = localStorage.getItem('esg_tema');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-tema', t);
        document.documentElement.setAttribute('data-bs-theme', t);
      } catch (e) {}
    </script>
    <title>Portal Académico · ESGFAA</title>
  </head>
  <body>
    <div id="raiz-portal"></div>
    <script type="module" src="/src/portal/main.jsx"></script>
  </body>
</html>
